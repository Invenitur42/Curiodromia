<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curiodromia – Login</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  /* Login-specific styles matching the mockup */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
  }
  .login-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(40,40,40,0.4), transparent),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(30,30,30,0.3), transparent);
    pointer-events: none;
  }
  .login-card {
    width: min(360px, 92vw);
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 2.5rem 2rem 1.75rem;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03);
  }
  .login-logo {
    font-family: "Segoe Script", "Brush Script MT", "Comic Sans MS", cursive;
    font-size: 2.4rem;
    font-weight: 400;
    text-align: center;
    margin: 0 0 2rem;
    color: #f0f0f0;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .login-field {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 0.7rem 1rem;
    margin-bottom: 0.85rem;
    transition: border-color 0.15s;
  }
  .login-field:focus-within {
    border-color: #555;
  }
  .login-field svg {
    width: 18px;
    height: 18px;
    stroke: #888;
    fill: none;
    stroke-width: 1.8;
    flex-shrink: 0;
  }
  .login-field input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e8e8e8;
    font-size: 0.95rem;
    padding: 0;
  }
  .login-field input::placeholder {
    color: #666;
  }
  .login-enter {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.85rem;
    background: #f5f5f5;
    color: #111;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .login-enter:hover { opacity: 0.92; }
  .login-enter:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-forgot {
    display: block;
    text-align: center;
    margin-top: 1.1rem;
    font-size: 0.82rem;
    color: #777;
    text-decoration: none;
  }
  .login-forgot:hover { color: #aaa; }
  .login-error {
    color: #ff6b6b;
    font-size: 0.82rem;
    text-align: center;
    min-height: 1.3em;
    margin: 0.4rem 0 0;
  }
  .login-hint {
    text-align: center;
    font-size: 0.75rem;
    color: #555;
    margin-top: 1.25rem;
  }
</style>
</head>
<body>
  <section class="login-screen">
    <div class="login-card">
      <h1 class="login-logo">Curiodromia</h1>

      <form id="loginForm">
        <div class="login-field">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
          <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required maxlength="20" />
        </div>
        <div class="login-field">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required minlength="6" />
        </div>

        <p class="login-error" id="loginError"></p>

        <button type="submit" class="login-enter" id="enterBtn">Enter</button>
      </form>

      <a href="#" class="login-forgot" id="forgotLink">Forgot password?</a>
      <p class="login-hint">New here? Just enter a username &amp; password to create your account.</p>
    </div>
  </section>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      alert("Password recovery is not yet available. Remember your password or create a new account with a different username.");
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("loginError");
      const btn = document.getElementById("enterBtn");
      errEl.textContent = "";
      btn.disabled = true;

      try {
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        // First login (new account or incomplete setup) → onboarding
        // Returning user with completed setup → home feed
        location.href = data.needsOnboarding ? "/onboarding.html" : "/home.html";
      } catch (err) {
        errEl.textContent = err.message || "Login failed";
        btn.disabled = false;
      }
    });

    // Already logged in? Skip login screen.
    api("/api/me").then(({ user, needsOnboarding }) => {
      if (user) location.href = needsOnboarding ? "/onboarding.html" : "/home.html";
    }).catch(() => {});
  </script>
</body>
</html>
