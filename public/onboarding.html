<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to Agora</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <section class="onboard-screen">
    <div class="onboard-card">
      <h1 class="brand">Agora<span>.</span></h1>
      <p class="tagline" id="welcomeLine">What brings you here?</p>

      <div class="choice-row">
        <div class="choice-card" id="chooseLearn">
          <h3>🎯 I want to learn something</h3>
          <p>Tell us a topic and we'll point you to curated resources and matching classrooms.</p>
        </div>
        <div class="choice-card" id="chooseExplore">
          <h3>🧭 Just exploring</h3>
          <p>Skip straight to today's trending questions, ranked by the community.</p>
        </div>
      </div>

      <form id="goalForm" class="goal-form">
        <label>What do you want to learn?
          <input type="text" id="goalInput" placeholder="e.g. building REST APIs, watercolor painting…" required />
        </label>
        <label>Closest category
          <select id="categorySelect" required></select>
        </label>
        <p class="error" id="goalError"></p>
        <button type="submit" class="primary full">See resources</button>
      </form>
    </div>
  </section>

  <script src="/js/common.js"></script>
  <script>
    (async function init() {
      const user = await requireSession({ allowPreOnboarding: true });
      document.getElementById("welcomeLine").textContent = `Welcome, ${user.username}. What brings you here?`;

      const { categories } = await api("/api/categories");
      const select = document.getElementById("categorySelect");
      select.innerHTML = categories.map((c) => `<option value="${c.slug}">${escapeHtml(c.label)}</option>`).join("");
    })();

    document.getElementById("chooseExplore").addEventListener("click", async () => {
      await api("/api/onboarding", { method: "POST", body: JSON.stringify({ mode: "explore" }) });
      location.href = "/home.html";
    });

    document.getElementById("chooseLearn").addEventListener("click", () => {
      document.getElementById("goalForm").classList.add("visible");
      document.getElementById("goalInput").focus();
    });

    document.getElementById("goalForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const goal = document.getElementById("goalInput").value.trim();
      const category = document.getElementById("categorySelect").value;
      try {
        await api("/api/onboarding", { method: "POST", body: JSON.stringify({ mode: "learning", goal, category }) });
        location.href = `/resources.html?category=${encodeURIComponent(category)}`;
      } catch (err) {
        document.getElementById("goalError").textContent = err.message;
      }
    });
  </script>
</body>
</html>
