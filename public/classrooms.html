<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Classes — Curiodromia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-layout">
      <aside class="sidebar-left">
        <h2>Category</h2>
        <input type="search" id="catSearch" placeholder="Search…" style="width:100%;margin-bottom:0.6rem;font-size:0.85rem;" />
        <ul class="category-list" id="categoryList">
          <li><button type="button" class="active" data-cat="">All</button></li>
        </ul>
      </aside>

      <main class="main-col">
        <div class="classes-header">
          <h1>Classes</h1>
          <div class="sort-row">
            <button type="button" class="active" data-sort="most">Most</button>
            <button type="button" data-sort="least">Least</button>
            <button type="button" data-sort="rec">For you</button>
          </div>
        </div>
        <div id="classroomList"></div>
      </main>

      <aside class="sidebar-right" id="createSidebar">
        <h2>Create</h2>
        <div class="create-panel">
          <textarea id="createTitle" placeholder="What topic or question do you want to explore?" maxlength="200"></textarea>
          <select id="createCategory"></select>
          <label class="upload-zone" id="bannerZone">
            <input type="file" id="bannerInput" accept="image/*" hidden />
            <span id="bannerLabel">Upload class banner<br><span style="font-size:0.75rem;opacity:0.7">JPG, PNG · Max 5MB</span></span>
          </label>
          <button type="button" class="primary" id="createBtn" style="width:100%">Create Class</button>
          <p class="error" id="createError" style="min-height:1.2em;"></p>
        </div>
      </aside>
    </div>
    <div class="mobile-post-bar">
      <button type="button" class="primary" id="mobileCreateOpen">+ Create class</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let currentCategory = "";
    let currentSort = "most";
    let bannerFile = null;
    let allCategories = [];

    function renderCats(filter = "") {
      const list = document.getElementById("categoryList");
      const q = filter.toLowerCase();
      list.innerHTML = `<li><button type="button" class="${currentCategory===""?"active":""}" data-cat="">All</button></li>`;
      allCategories
        .filter((c) => !q || c.label.toLowerCase().includes(q))
        .forEach((c) => {
          const li = document.createElement("li");
          li.innerHTML = `<button type="button" data-cat="${escapeHtml(c.slug)}" class="${currentCategory===c.slug?"active":""}">${escapeHtml(c.label)}</button>`;
          list.appendChild(li);
        });
    }

    async function load() {
      const params = new URLSearchParams();
      if (currentCategory) params.set("category", currentCategory);
      const { classrooms } = await api(`/api/classrooms?${params}`);
      let list = classrooms.slice();
      list.sort((a, b) => (b.member_count || 0) - (a.member_count || 0));
      if (currentSort === "least") list.reverse();
      if (currentSort === "rec") {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }
      render(list);
    }

    function render(classrooms) {
      const el = document.getElementById("classroomList");
      if (!classrooms.length) {
        el.innerHTML = `<p class="empty-note">No classes yet — create the first one.</p>`;
        return;
      }
      el.innerHTML = classrooms.map((c) => {
        const thumb = c.banner_url
          ? `<img src="${escapeHtml(c.banner_url)}" class="thumb" alt="" />`
          : `<div class="thumb">◎</div>`;
        return `
        <article class="class-card">
          ${thumb}
          <div class="info">
            <div class="title">${escapeHtml(c.title)}</div>
            <div class="desc">${c.category ? escapeHtml(c.category) : "Open"} · ${c.status === "open" ? "Live" : "Ended"}</div>
            <div class="meta"><span>↑ ${c.member_count || 0}</span><span>by ${escapeHtml(c.creator_name || "?")}</span></div>
          </div>
          <a class="enter-btn" href="/classroom.html?id=${c.id}">${c.status === "open" ? "Enter" : "View"}</a>
        </article>`;
      }).join("");
    }

    document.querySelectorAll(".sort-row button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-row button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        load();
      });
    });

    document.getElementById("bannerInput").addEventListener("change", (e) => {
      bannerFile = e.target.files[0] || null;
      document.getElementById("bannerLabel").innerHTML = bannerFile
        ? `✓ ${escapeHtml(bannerFile.name)}`
        : `Upload class banner<br><span style="font-size:0.75rem;opacity:0.7">JPG, PNG · Max 5MB</span>`;
    });

    document.getElementById("createBtn").addEventListener("click", async () => {
      const title = document.getElementById("createTitle").value.trim();
      const category = document.getElementById("createCategory").value;
      document.getElementById("createError").textContent = "";
      if (!title) {
        document.getElementById("createError").textContent = "Give your class a topic.";
        return;
      }
      try {
        const fd = new FormData();
        fd.append("title", title);
        if (category) fd.append("category", category);
        if (bannerFile) fd.append("banner", bannerFile);
        const res = await fetch("/api/classrooms", { method: "POST", body: fd, credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed");
        location.href = `/classroom.html?id=${data.id}`;
      } catch (err) {
        document.getElementById("createError").textContent = err.message;
      }
    });

    document.getElementById("catSearch").addEventListener("input", (e) => renderCats(e.target.value));
    document.getElementById("categoryList").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-cat]");
      if (!btn) return;
      currentCategory = btn.dataset.cat || "";
      renderCats(document.getElementById("catSearch").value);
      load();
    });

    document.getElementById("mobileCreateOpen").addEventListener("click", () => {
      document.getElementById("createSidebar").classList.toggle("mobile-open");
    });

    (async function init() {
      await requireSession();
      renderTopLogo();
      renderBottomNav("classes");
      const { categories } = await api("/api/categories");
      allCategories = categories;
      renderCats();
      const sel = document.getElementById("createCategory");
      sel.innerHTML = `<option value="">Category (optional)</option>`;
      categories.forEach((c) => {
        sel.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.label)}</option>`);
      });
      load();
    })();
  </script>
</body>
</html>
