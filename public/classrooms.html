<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Classrooms — Agora</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navHost"></div>

  <main class="page">
    <div class="page-header">
      <h1>Classrooms</h1>
      <button type="button" class="primary" id="startBtn">+ Start a classroom</button>
    </div>

    <div class="filters">
      <input type="search" id="searchInput" placeholder="Search by topic…" />
      <select id="categoryFilter"><option value="">All categories</option></select>
    </div>

    <div id="classroomList"></div>
  </main>

  <dialog id="startDialog">
    <form id="startForm" class="form-col">
      <h3>Start a classroom</h3>
      <p class="hint" style="margin:0;">The title is your "intro" — the topic or question you want to explore. Others will see this before joining.</p>
      <input type="text" id="startTitle" placeholder="e.g. Let's untangle Git rebasing" required maxlength="200" />
      <select id="startCategory" required></select>
      <p class="error" id="startError"></p>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="startCancel">Cancel</button>
        <button type="submit" class="primary">Create &amp; enter</button>
      </div>
    </form>
  </dialog>

  <script src="/js/common.js"></script>
  <script>
    async function load() {
      const params = new URLSearchParams();
      const search = document.getElementById("searchInput").value.trim();
      const category = document.getElementById("categoryFilter").value;
      if (search) params.set("search", search);
      if (category) params.set("category", category);
      const { classrooms } = await api(`/api/classrooms?${params}`);

      document.getElementById("classroomList").innerHTML = classrooms.length
        ? classrooms
            .map(
              (c) => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:1rem;">
            <div>
              <strong>${escapeHtml(c.title)}</strong>
              <div class="q-meta">
                by ${escapeHtml(c.creator_name)}
                ${c.category ? `<span class="badge category">${escapeHtml(c.category)}</span>` : ""}
                <span class="badge">${c.member_count} member${c.member_count === 1 ? "" : "s"}</span>
                <span class="badge" style="${c.status === "open" ? "color:var(--accent-2); border-color:var(--accent-2);" : ""}">${c.status === "open" ? "● live" : "ended"}</span>
              </div>
            </div>
            <a href="/classroom.html?id=${c.id}" class="ghost small" style="padding:0.5rem 1rem; border-radius:8px; border:1px solid var(--border); white-space:nowrap;">
              ${c.status === "open" ? "View / Join" : "View recap"}
            </a>
          </div>`
            )
            .join("")
        : `<p class="empty-note">No classrooms match yet — start the first one.</p>`;
    }

    document.getElementById("searchInput").addEventListener("input", load);
    document.getElementById("categoryFilter").addEventListener("change", load);

    document.getElementById("startBtn").addEventListener("click", () => document.getElementById("startDialog").showModal());
    document.getElementById("startCancel").addEventListener("click", () => document.getElementById("startDialog").close());

    document.getElementById("startForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("startError").textContent = "";
      try {
        const { id } = await api("/api/classrooms", {
          method: "POST",
          body: JSON.stringify({
            title: document.getElementById("startTitle").value.trim(),
            category: document.getElementById("startCategory").value,
          }),
        });
        location.href = `/classroom.html?id=${id}`;
      } catch (err) {
        document.getElementById("startError").textContent = err.message;
      }
    });

    (async function init() {
      await requireSession();
      renderNav("/classrooms.html");
      const { categories } = await api("/api/categories");
      const opts = categories.map((c) => `<option value="${c.slug}">${escapeHtml(c.label)}</option>`).join("");
      document.getElementById("categoryFilter").insertAdjacentHTML("beforeend", opts);
      document.getElementById("startCategory").innerHTML = opts;
      load();
    })();
  </script>
</body>
</html>
