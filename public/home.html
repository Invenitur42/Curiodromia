<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home — Curiodromia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-layout">
      <!-- Left: Categories -->
      <aside class="sidebar-left">
        <h2>Category</h2>
        <ul class="category-list" id="categoryList">
          <li><button type="button" class="active" data-cat="">All</button></li>
        </ul>
      </aside>

      <!-- Center: Feed -->
      <main class="main-col">
        <h1>Feed</h1>
        <div class="sort-tabs">
          <button type="button" class="active" data-sort="most">Most</button>
          <button type="button" data-sort="least">Least</button>
          <button type="button" data-sort="rec">Recommendations</button>
        </div>
        <p class="feed-section-label">Most upvoted today</p>
        <div id="questionList"></div>
      </main>

      <!-- Right: Ask -->
      <aside class="sidebar-right">
        <h2>Input</h2>
        <div class="input-panel">
          <textarea id="askTitle" placeholder="Ask a question..." maxlength="200"></textarea>
          <div class="media-row">
            <button type="button" class="media-btn" title="Image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              Image
            </button>
            <button type="button" class="media-btn" title="Video">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>
              Video
            </button>
            <button type="button" class="media-btn" title="Audio">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              Audio
            </button>
          </div>
          <select id="askCategory" style="margin-top:0.25rem;"></select>
          <button type="button" class="primary post-btn" id="postBtn">Post</button>
          <p class="error" id="askError" style="min-height:1.2em;"></p>
        </div>
      </aside>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let me = null;
    let currentCategory = "";
    let currentSort = "most";

    const categoryIcons = {
      psychology: "🧠", physics: "⚛️", maths: "π", "self-care": "♡",
      philosophy: "⌛", biology: "🍃", creativity: "💡", history: "🏛",
      language: "文", technology: "⚙", art: "🎨",
    };

    async function loadQuestions() {
      const params = new URLSearchParams({ scope: "today", sort: "trending" });
      if (currentCategory) params.set("category", currentCategory);
      const { questions } = await api(`/api/questions?${params}`);
      let list = questions.slice();
      if (currentSort === "least") list = list.slice().reverse();
      if (currentSort === "rec") {
        list = list.slice(0, Math.max(6, Math.ceil(list.length / 2)));
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }
      renderQuestions(list);
    }

    function renderQuestions(questions) {
      const el = document.getElementById("questionList");
      if (!questions.length) {
        el.innerHTML = `<p class="empty-note">No questions yet — be the first to ask one.</p>`;
        return;
      }
      el.innerHTML = questions.map((q) => `
        <article class="question-card" data-id="${q.id}">
          <div class="vote-col feed-vote">
            <button type="button" class="vote-btn" data-vote="1" data-id="${q.id}" title="Upvote">▲</button>
            <span class="vote-score">${q.score ?? 0}</span>
            <button type="button" class="vote-btn" data-vote="-1" data-id="${q.id}" title="Downvote">▼</button>
          </div>
          <div class="q-content">
            <p class="q-title"><a href="/question.html?id=${q.id}">${escapeHtml(q.title)}</a></p>
            <div class="q-meta">
              <span>${escapeHtml(q.username || "anon")}</span>
              <span>${timeAgo(q.created_at)}</span>
              ${q.category ? `<span class="badge category">${escapeHtml(q.category)}</span>` : ""}
              <span>${q.answer_count || 0} answer${(q.answer_count || 0) === 1 ? "" : "s"}</span>
            </div>
          </div>
        </article>`).join("");

      el.querySelectorAll(".vote-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          try {
            const { score } = await api("/api/vote", {
              method: "POST",
              body: JSON.stringify({
                targetType: "question",
                targetId: Number(btn.dataset.id),
                value: Number(btn.dataset.vote),
              }),
            });
            const card = btn.closest(".question-card");
            if (card) {
              const scoreEl = card.querySelector(".vote-score");
              if (scoreEl) scoreEl.textContent = score;
            }
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    document.querySelectorAll(".sort-tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-tabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        loadQuestions();
      });
    });

    document.getElementById("postBtn").addEventListener("click", async () => {
      const title = document.getElementById("askTitle").value.trim();
      const category = document.getElementById("askCategory").value;
      document.getElementById("askError").textContent = "";
      if (!title) {
        document.getElementById("askError").textContent = "Write a question first.";
        return;
      }
      try {
        await api("/api/questions", {
          method: "POST",
          body: JSON.stringify({ title, body: "", category: category || null }),
        });
        document.getElementById("askTitle").value = "";
        loadQuestions();
      } catch (err) {
        document.getElementById("askError").textContent = err.message;
      }
    });

    (async function init() {
      me = await requireSession();
      renderBottomNav("home");

      const { categories } = await api("/api/categories");
      const list = document.getElementById("categoryList");
      const askSel = document.getElementById("askCategory");
      askSel.innerHTML = `<option value="">Choose category (optional)</option>`;

      categories.forEach((c) => {
        const icon = categoryIcons[c.slug] || "•";
        const li = document.createElement("li");
        li.innerHTML = `<button type="button" data-cat="${escapeHtml(c.slug)}"><span class="icon">${icon}</span>${escapeHtml(c.label)}</button>`;
        list.appendChild(li);
        askSel.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.label)}</option>`);
      });

      list.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        list.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.cat || "";
        loadQuestions();
      });

      loadQuestions();
    })();
  </script>
</body>
</html>
