<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home — Curiodromia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-layout">
      <aside class="sidebar-left">
        <h2>Category</h2>
        <input type="search" id="catSearch" placeholder="Search categories…" style="width:100%;margin-bottom:0.6rem;font-size:0.85rem;" />
        <ul class="category-list" id="categoryList"><li><button type="button" class="active" data-cat="">All</button></li></ul>
        <div style="margin-top:0.75rem;display:flex;gap:0.35rem;">
          <input type="text" id="newCatInput" placeholder="New category" maxlength="40" style="flex:1;font-size:0.8rem;padding:0.4rem 0.5rem;" />
          <button type="button" class="ghost small" id="addCatBtn">+</button>
        </div>
      </aside>
      <main class="main-col">
        <h1>Feed</h1>
        <div class="sort-tabs">
          <button type="button" class="active" data-sort="most">Most</button>
          <button type="button" data-sort="least">Least</button>
          <button type="button" data-sort="rec">For you</button>
        </div>
        <p class="feed-section-label">Community questions</p>
        <div id="questionList"></div>
      </main>
      <aside class="sidebar-right" id="inputSidebar">
        <h2>Compose</h2>
        <div class="input-panel">
          <textarea id="askTitle" placeholder="Ask a question…" maxlength="200"></textarea>
          <div class="media-row">
            <label class="media-btn" id="btnImage"><input type="file" id="mediaImage" accept="image/*" hidden />Image</label>
            <label class="media-btn" id="btnVideo"><input type="file" id="mediaVideo" accept="video/*" hidden />Video</label>
            <label class="media-btn" id="btnAudio"><input type="file" id="mediaAudio" accept="audio/*" hidden />Audio</label>
          </div>
          <p id="mediaLabel" style="font-size:0.75rem;color:var(--muted);min-height:1.1em;"></p>
          <select id="askCategory"></select>
          <button type="button" class="primary post-btn" id="postBtn">Post</button>
          <p class="error" id="askError"></p>
        </div>
      </aside>
    </div>
    <div class="mobile-post-bar"><button type="button" class="primary" id="mobilePostOpen">+ Ask a question</button></div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    let currentCategory = "", currentSort = "most", selectedFile = null, allCategories = [];

    function renderCategoryList(filter = "") {
      const list = document.getElementById("categoryList");
      const q = filter.toLowerCase();
      list.innerHTML = `<li><button type="button" class="${currentCategory===""?"active":""}" data-cat="">All</button></li>`;
      allCategories.filter(c => !q || c.label.toLowerCase().includes(q)).forEach(c => {
        const li = document.createElement("li");
        li.innerHTML = `<button type="button" data-cat="${escapeHtml(c.slug)}" class="${currentCategory===c.slug?"active":""}">${escapeHtml(c.label)}</button>`;
        list.appendChild(li);
      });
    }

    async function loadQuestions() {
      const params = new URLSearchParams({ scope: "today", sort: "trending" });
      if (currentCategory) params.set("category", currentCategory);
      let { questions } = await api(`/api/questions?${params}`);
      if (currentSort === "least") questions = questions.slice().reverse();
      if (currentSort === "rec") {
        questions = questions.slice(0, Math.max(6, Math.ceil(questions.length / 2)));
        for (let i = questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questions[i], questions[j]] = [questions[j], questions[i]];
        }
      }
      const el = document.getElementById("questionList");
      if (!questions.length) {
        el.innerHTML = `<p class="empty-note">No questions yet — be the first to ask one.</p>`;
        return;
      }
      el.innerHTML = questions.map(q => {
        const thumb = q.avatar_thumb || q.avatar_url || "/img/default-avatar.svg";
        return `<article class="question-card" data-id="${q.id}">
          <div class="vote-col">
            <button type="button" class="vote-btn" data-vote="1" data-id="${q.id}">▲</button>
            <span class="vote-score">${q.score ?? 0}</span>
            <button type="button" class="vote-btn" data-vote="-1" data-id="${q.id}">▼</button>
          </div>
          <div class="q-content">
            <p class="q-title"><a href="/question.html?id=${q.id}">${escapeHtml(q.title)}</a></p>
            ${renderMediaThumb(q.media_type, q.media_url)}
            <div class="q-meta">
              <img src="${escapeHtml(thumb)}" class="avatar-sm" alt="" style="width:18px;height:18px;" />
              <a href="/profile.html?id=${q.user_id}">${escapeHtml(q.username || "anon")}</a>
              <span>${timeAgo(q.created_at)}</span>
              ${q.category ? `<span class="badge category">${escapeHtml(q.category)}</span>` : ""}
              <span>${q.answer_count || 0} answers</span>
            </div>
          </div>
        </article>`;
      }).join("");
      el.querySelectorAll(".vote-btn").forEach(btn => {
        btn.addEventListener("click", async e => {
          e.preventDefault();
          try {
            const { score } = await api("/api/vote", { method: "POST", body: JSON.stringify({ targetType: "question", targetId: Number(btn.dataset.id), value: Number(btn.dataset.vote) }) });
            btn.closest(".question-card").querySelector(".vote-score").textContent = score;
          } catch (err) { alert(err.message); }
        });
      });
    }

    function bindMedia(inputId, btnId, label) {
      document.getElementById(inputId).addEventListener("change", e => {
        const f = e.target.files[0]; if (!f) return;
        selectedFile = f;
        document.getElementById("mediaLabel").textContent = `${label}: ${f.name}`;
        ["btnImage","btnVideo","btnAudio"].forEach(id => document.getElementById(id).classList.toggle("has-file", id === btnId));
        ["mediaImage","mediaVideo","mediaAudio"].forEach(id => { if (id !== inputId) document.getElementById(id).value = ""; });
      });
    }

    document.querySelectorAll(".sort-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        loadQuestions();
      });
    });

    document.getElementById("postBtn").addEventListener("click", async () => {
      const title = document.getElementById("askTitle").value.trim();
      const category = document.getElementById("askCategory").value;
      document.getElementById("askError").textContent = "";
      if (!title) { document.getElementById("askError").textContent = "Write a question first."; return; }
      try {
        const fd = new FormData();
        fd.append("title", title);
        if (category) fd.append("category", category);
        if (selectedFile) fd.append("media", selectedFile);
        const res = await fetch("/api/questions", { method: "POST", body: fd, credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed");
        document.getElementById("askTitle").value = "";
        document.getElementById("mediaLabel").textContent = "";
        selectedFile = null;
        loadQuestions();
      } catch (err) { document.getElementById("askError").textContent = err.message; }
    });

    document.getElementById("catSearch").addEventListener("input", e => renderCategoryList(e.target.value));
    document.getElementById("categoryList").addEventListener("click", e => {
      const btn = e.target.closest("button[data-cat]"); if (!btn) return;
      currentCategory = btn.dataset.cat || "";
      renderCategoryList(document.getElementById("catSearch").value);
      loadQuestions();
    });
    document.getElementById("addCatBtn").addEventListener("click", async () => {
      const label = document.getElementById("newCatInput").value.trim(); if (!label) return;
      try {
        const { category } = await api("/api/categories", { method: "POST", body: JSON.stringify({ label }) });
        document.getElementById("newCatInput").value = "";
        allCategories = (await api("/api/categories")).categories;
        renderCategoryList();
        document.getElementById("askCategory").insertAdjacentHTML("beforeend", `<option value="${escapeHtml(category.slug)}">${escapeHtml(category.label)}</option>`);
      } catch (err) { alert(err.message); }
    });
    document.getElementById("mobilePostOpen").addEventListener("click", () => document.getElementById("inputSidebar").classList.toggle("mobile-open"));

    (async function init() {
      await requireSession();
      renderTopLogo();
      renderBottomNav("home");
      ensureLightbox();
      bindMedia("mediaImage", "btnImage", "Image");
      bindMedia("mediaVideo", "btnVideo", "Video");
      bindMedia("mediaAudio", "btnAudio", "Audio");
      allCategories = (await api("/api/categories")).categories;
      renderCategoryList();
      const askSel = document.getElementById("askCategory");
      askSel.innerHTML = `<option value="">Category (optional)</option>`;
      allCategories.forEach(c => askSel.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.label)}</option>`));
      loadQuestions();
    })();
  </script>
</body>
</html>
