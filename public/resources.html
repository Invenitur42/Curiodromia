<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resources — Curiodromia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navHost"></div>

  <main class="page">
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
      <h1 id="pageTitle" style="margin:0;font-size:1.3rem;">Resources</h1>
      <a href="/home.html" class="ghost small">Go to feed →</a>
    </div>
    <p id="goalLine" style="color:var(--muted);margin-bottom:1.25rem;font-size:0.9rem;"></p>

    <div class="resource-grid" id="resourceGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.9rem;"></div>

    <h2 style="font-size:1.05rem;margin:2rem 0 0.75rem;">Classes in this category</h2>
    <div id="classroomList"></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    (async function init() {
      const user = await requireSession();
      renderNav("/home.html");
      renderBottomNav("home");

      const category = qs("category") || user.learning_category;
      if (!category) { location.href = "/home.html"; return; }

      const { categories } = await api("/api/categories");
      const label = (categories.find((c) => c.slug === category) || {}).label || category;
      document.getElementById("pageTitle").textContent = `Learning: ${label}`;
      document.getElementById("goalLine").textContent = user.learning_goal
        ? `Based on what you told us: “${user.learning_goal}”`
        : "";

      const { resources } = await api(`/api/resources?category=${encodeURIComponent(category)}`);
      document.getElementById("resourceGrid").innerHTML = resources.length
        ? resources.map((r) => `
          <div class="card">
            <h3 style="font-size:0.98rem;margin:0 0 0.4rem;">${escapeHtml(r.title)}</h3>
            <p style="font-size:0.85rem;color:var(--muted);margin:0 0 0.65rem;">${escapeHtml(r.description || "")}</p>
            <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">Visit →</a>
          </div>`).join("")
        : `<p class="empty-note">No curated resources for this category yet.</p>`;

      const { classrooms } = await api(`/api/classrooms?category=${encodeURIComponent(category)}`);
      document.getElementById("classroomList").innerHTML = classrooms.length
        ? classrooms.map((c) => `
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">
            <div>
              <strong>${escapeHtml(c.title)}</strong>
              <div class="q-meta">by ${escapeHtml(c.creator_name)} · ${c.member_count} members · ${c.status === "open" ? "live" : "ended"}</div>
            </div>
            <a href="/classroom.html?id=${c.id}" class="ghost small">View</a>
          </div>`).join("")
        : `<p class="empty-note">No classes yet — <a href="/classrooms.html">start one</a>.</p>`;
    })();
  </script>
</body>
</html>
