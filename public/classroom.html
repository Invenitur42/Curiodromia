<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Class — Curiodromia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navHost"></div>

  <main class="page" style="max-width:1100px;">
    <!-- Intro state: shown before joining -->
    <div id="introScreen" class="card intro-screen" hidden>
      <h1 id="introTitle"></h1>
      <p class="q-meta" id="introMeta" style="justify-content:center;"></p>
      <button type="button" class="primary" id="joinBtn" style="margin-top:1rem;">Join class →</button>
    </div>

    <!-- Content state: the live room -->
    <div id="contentScreen" hidden>
      <div class="page-header">
        <div>
          <h1 id="roomTitle" style="margin-bottom:0.2rem;"></h1>
          <span class="q-meta" id="roomMeta"></span>
        </div>
        <button type="button" class="danger" id="endBtn" hidden>End class</button>
      </div>

      <div id="endedBanner" class="ended-banner" hidden>
        <strong>This class has ended.</strong>
        <p id="conclusionText" style="margin:0.5rem 0 0;"></p>
      </div>

      <div class="classroom-layout">
        <div>
          <div class="chat-thread card" id="chatThread"></div>

          <form id="postForm" class="card form-col" style="margin-top:0.8rem;">
            <select id="postMode">
              <option value="question">Ask a new question</option>
            </select>
            <textarea id="postBody" rows="2" placeholder="Type your question or answer…" required></textarea>
            <p class="error" id="postError"></p>
            <button type="submit" class="primary" style="align-self:flex-end;">Post</button>
          </form>
        </div>

        <div style="display:flex; flex-direction:column; gap:0.9rem;">
          <div class="sidebar-card">
            <h3>🏅 Milestones</h3>
            <div id="milestoneList" class="milestone-list"></div>
          </div>
          <div class="sidebar-card">
            <h3>📊 Ranked questions</h3>
            <div id="rankedList"></div>
          </div>
          <div class="sidebar-card">
            <h3>👥 Members (<span id="memberCount">0</span>)</h3>
            <div id="memberList"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <dialog id="endDialog">
    <form id="endForm" class="form-col">
      <h3>End this class</h3>
      <p class="hint" style="margin:0;">Write a short conclusion summarizing what the room covered.</p>
      <textarea id="conclusionInput" rows="4" placeholder="Write the conclusion manually…"></textarea>
      <button type="button" class="ghost" disabled title="AI-generated conclusions are still under development" style="align-self:flex-start;">
        ✨ Generate with AI <span class="dev-tag">Coming soon</span>
      </button>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="endCancel">Cancel</button>
        <button type="submit" class="danger">End &amp; publish conclusion</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let me = null;
    const classroomId = qs("id");
    let socket = null;
    let latest = null; // last loaded classroom payload

    async function load() {
      const data = await api(`/api/classrooms/${classroomId}`);
      latest = data;
      render(data);
    }

    function render({ classroom, isMember, members, questions, milestones }) {
      const isCreator = classroom.creator_id === me.id;
      const isOpen = classroom.status === "open";

      if (!isMember) {
        document.getElementById("introScreen").hidden = false;
        document.getElementById("contentScreen").hidden = true;
        document.getElementById("introTitle").textContent = classroom.title;
        document.getElementById("introMeta").innerHTML = `
          by ${escapeHtml(classroom.creator_name)}
          ${classroom.category ? `<span class="badge category">${escapeHtml(classroom.category)}</span>` : ""}
          <span class="badge">${members.length} member${members.length === 1 ? "" : "s"}</span>
          <span class="badge">${isOpen ? "● live" : "ended"}</span>`;
        return;
      }

      document.getElementById("introScreen").hidden = true;
      document.getElementById("contentScreen").hidden = false;
      document.getElementById("roomTitle").textContent = classroom.title;
      document.getElementById("roomMeta").innerHTML = `
        by ${escapeHtml(classroom.creator_name)}
        ${classroom.category ? `<span class="badge category">${escapeHtml(classroom.category)}</span>` : ""}
        <span class="badge">${isOpen ? "● live" : "ended"}</span>`;

      document.getElementById("endBtn").hidden = !(isCreator && isOpen);
      document.getElementById("postForm").hidden = !isOpen;

      document.getElementById("endedBanner").hidden = isOpen;
      if (!isOpen) {
        document.getElementById("conclusionText").textContent =
          classroom.conclusion || "The creator ended this class without adding a written conclusion.";
      }

      // Chat thread: questions in chronological order, each followed by its answers.
      const thread = document.getElementById("chatThread");
      if (!questions.length) {
        thread.innerHTML = `<p class="empty-note">No questions posted yet — ask the first one below.</p>`;
      } else {
        thread.innerHTML = questions
          .map(
            (q) => `
          <div class="q-card" style="border-bottom:1px solid var(--border); padding-bottom:0.6rem;">
            <div class="vote-col">
              <button type="button" class="vote-btn" data-vote="1" data-type="question" data-id="${q.id}">▲</button>
              <span class="vote-score">${q.score}</span>
              <button type="button" class="vote-btn" data-vote="-1" data-type="question" data-id="${q.id}">▼</button>
            </div>
            <div class="q-body">
              <p class="q-title" style="font-size:0.95rem;">${escapeHtml(q.title)}</p>
              <div class="q-meta"><span>${escapeHtml(q.username)}</span><span>${timeAgo(q.created_at)}</span><span>${q.answer_count} answer${q.answer_count === 1 ? "" : "s"}</span></div>
            </div>
          </div>`
          )
          .join("");
        thread.querySelectorAll(".vote-btn").forEach(attachVoteHandler);
      }

      // Ranked list (most rated -> least)
      const ranked = [...questions].sort((a, b) => b.score - a.score);
      document.getElementById("rankedList").innerHTML = ranked.length
        ? ranked.map((q) => `<div class="q-meta" style="justify-content:space-between; padding:0.25rem 0;"><span>${escapeHtml(q.title)}</span><strong>${q.score}</strong></div>`).join("")
        : `<p class="empty-note" style="padding:0.5rem 0;">No questions yet.</p>`;

      // Milestones
      document.getElementById("milestoneList").innerHTML = milestones.length
        ? milestones
            .map(
              (m) => `
          <div class="answer milestone">
            <div class="milestone-tag">⭐ ${m.score} pts · re: ${escapeHtml(m.question_title)}</div>
            <p style="margin:0.3rem 0 0; font-size:0.9rem;">${escapeHtml(m.body)}</p>
            <div class="q-meta">${escapeHtml(m.username)}</div>
          </div>`
            )
            .join("")
        : `<p class="empty-note" style="padding:0.5rem 0;">No highly-rated answers yet.</p>`;

      // Members
      document.getElementById("memberCount").textContent = members.length;
      document.getElementById("memberList").innerHTML = members
        .map((m) => `<div class="member-chip"><img class="avatar-sm" src="${m.avatar_url || "/img/default-avatar.svg"}" alt="" /> ${escapeHtml(m.username)}</div>`)
        .join("");

      // Post form's "answer to" options
      const modeSelect = document.getElementById("postMode");
      const prev = modeSelect.value;
      modeSelect.innerHTML =
        `<option value="question">Ask a new question</option>` +
        questions.map((q) => `<option value="answer:${q.id}">Answer: ${escapeHtml(q.title.slice(0, 60))}</option>`).join("");
      if ([...modeSelect.options].some((o) => o.value === prev)) modeSelect.value = prev;
    }

    function attachVoteHandler(btn) {
      btn.addEventListener("click", async () => {
        try {
          await api("/api/vote", {
            method: "POST",
            body: JSON.stringify({ targetType: btn.dataset.type, targetId: Number(btn.dataset.id), value: Number(btn.dataset.vote) }),
          });
          load();
        } catch (err) {
          alert(err.message);
        }
      });
    }

    document.getElementById("joinBtn").addEventListener("click", async () => {
      await api(`/api/classrooms/${classroomId}/join`, { method: "POST" });
      socket.emit("join_classroom", Number(classroomId));
      load();
    });

    document.getElementById("postForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("postError").textContent = "";
      const mode = document.getElementById("postMode").value;
      const body = document.getElementById("postBody").value.trim();
      try {
        if (mode === "question") {
          await api("/api/questions", { method: "POST", body: JSON.stringify({ title: body, classroomId: Number(classroomId) }) });
        } else {
          const questionId = mode.split(":")[1];
          await api(`/api/questions/${questionId}/answers`, { method: "POST", body: JSON.stringify({ body }) });
        }
        document.getElementById("postBody").value = "";
        load();
      } catch (err) {
        document.getElementById("postError").textContent = err.message;
      }
    });

    document.getElementById("endBtn").addEventListener("click", () => document.getElementById("endDialog").showModal());
    document.getElementById("endCancel").addEventListener("click", () => document.getElementById("endDialog").close());

    document.getElementById("endForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await api(`/api/classrooms/${classroomId}/end`, {
        method: "POST",
        body: JSON.stringify({ conclusion: document.getElementById("conclusionInput").value.trim() }),
      });
      document.getElementById("endDialog").close();
      load();
    });

    (async function init() {
      me = await requireSession();
      renderNav("/classrooms.html");

      socket = io();
      socket.on("connect", () => socket.emit("join_classroom", Number(classroomId)));
      socket.on("classroom_question", load);
      socket.on("classroom_answer", load);
      socket.on("classroom_vote", load);
      socket.on("classroom_member_joined", load);
      socket.on("classroom_ended", load);

      load();
    })();
  </script>
</body>
</html>
