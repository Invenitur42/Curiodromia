<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Class — Curiodromia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navHost"></div>

  <div id="introScreen" class="page" hidden>
    <div class="card" style="text-align:center;padding:2rem;">
      <h1 id="introTitle"></h1>
      <p class="q-meta" id="introMeta" style="justify-content:center;margin-top:0.5rem;"></p>
      <button type="button" class="primary" id="joinBtn" style="margin-top:1.25rem;">Join class</button>
    </div>
  </div>

  <div id="contentScreen" class="room-shell" hidden>
    <header class="room-header">
      <h1 id="roomTitle"></h1>
      <div class="room-meta" id="roomMeta"></div>
      <button type="button" class="danger small" id="endBtn" hidden style="margin-top:0.5rem;">End class</button>
    </header>

    <div id="endedBanner" class="card" hidden style="margin:0.75rem 1rem;">
      <strong>This class has ended.</strong>
      <p id="conclusionText" style="margin:0.4rem 0 0;color:var(--muted);"></p>
    </div>

    <div class="room-questions" id="questionThread"></div>

    <button type="button" class="room-side-toggle" id="sideToggle" aria-label="Open panel">☰</button>
    <aside class="room-side-panel" id="sidePanel">
      <h3>Milestones</h3>
      <div id="milestoneList"></div>
      <h3>Top questions</h3>
      <div id="rankedList"></div>
      <h3>Members (<span id="memberCount">0</span>)</h3>
      <div id="memberList"></div>
    </aside>

    <div class="room-composer" id="composer">
      <div class="reply-chip" id="replyChip">
        <span id="replyLabel">Answering…</span>
        <button type="button" id="replyClear">✕</button>
      </div>
      <div class="room-composer-row">
        <textarea id="composeBody" rows="1" placeholder="Ask a question…"></textarea>
        <button type="button" class="primary small" id="composeSend">Send</button>
      </div>
      <div class="attach-row">
        <label><input type="file" id="composeImage" accept="image/*" hidden />Image</label>
        <label><input type="file" id="composeAudio" accept="audio/*" hidden />Audio</label>
        <span id="composeFileLabel" style="font-size:0.75rem;color:var(--muted);"></span>
      </div>
      <p class="error" id="composeError"></p>
    </div>
  </div>

  <dialog id="endDialog">
    <form id="endForm" class="form-col card" style="min-width:min(360px,90vw);">
      <h3>End this class</h3>
      <textarea id="conclusionInput" rows="4" placeholder="Optional conclusion…"></textarea>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end;">
        <button type="button" class="ghost" id="endCancel">Cancel</button>
        <button type="submit" class="danger">End class</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let me = null;
    const classroomId = qs("id");
    let socket = null;
    let answeringId = null;
    let composeFile = null;

    async function load() {
      const data = await api(`/api/classrooms/${classroomId}`);
      render(data);
    }

    function render({ classroom, isMember, members, questions, milestones }) {
      const isCreator = classroom.creator_id === me.id;
      const isOpen = classroom.status === "open";

      if (!isMember) {
        document.getElementById("introScreen").hidden = false;
        document.getElementById("contentScreen").hidden = true;
        document.getElementById("introTitle").textContent = classroom.title;
        document.getElementById("introMeta").innerHTML = `
          by ${escapeHtml(classroom.creator_name)}
          ${classroom.category ? `<span class="badge category">${escapeHtml(classroom.category)}</span>` : ""}
          <span class="badge">${members.length} members</span>
          <span class="badge">${isOpen ? "● live" : "ended"}</span>`;
        return;
      }

      document.getElementById("introScreen").hidden = true;
      document.getElementById("contentScreen").hidden = false;
      document.getElementById("roomTitle").textContent = classroom.title;
      document.getElementById("roomMeta").innerHTML = `
        <span>by ${escapeHtml(classroom.creator_name)}</span>
        ${classroom.category ? `<span class="badge category">${escapeHtml(classroom.category)}</span>` : ""}
        <span class="badge">${isOpen ? "● Live" : "Closed"}</span>`;
      document.getElementById("endBtn").hidden = !(isCreator && isOpen);
      document.getElementById("composer").style.display = isOpen ? "" : "none";
      document.getElementById("endedBanner").hidden = isOpen;
      if (!isOpen) document.getElementById("conclusionText").textContent = classroom.conclusion || "No written conclusion.";

      const thread = document.getElementById("questionThread");
      if (!questions.length) {
        thread.innerHTML = `<p class="empty-note">No questions yet — ask the first one below.</p>`;
      } else {
        thread.innerHTML = questions.map(q => `
          <div class="room-q ${answeringId === q.id ? "answering" : ""}" data-id="${q.id}">
            <div class="rq-title">${escapeHtml(q.title)}</div>
            ${renderMediaThumb(q.media_type, q.media_url)}
            <div class="q-meta">
              <span>${escapeHtml(q.username)}</span>
              <span>${timeAgo(q.created_at)}</span>
              <span>${q.answer_count || 0} answers</span>
              <span>↑ ${q.score ?? 0}</span>
            </div>
            <div class="rq-actions">
              ${isOpen ? `<button type="button" class="answer-btn" data-answer="${q.id}">Answer</button>` : ""}
              <a href="/question.html?id=${q.id}" style="font-size:0.8rem;color:var(--muted);">View thread</a>
            </div>
          </div>`).join("");
        thread.querySelectorAll("[data-answer]").forEach(btn => {
          btn.addEventListener("click", () => {
            answeringId = Number(btn.dataset.answer);
            const q = questions.find(x => x.id === answeringId);
            document.getElementById("replyChip").classList.add("show");
            document.getElementById("replyLabel").textContent = `Answering: ${(q && q.title) || ""}`;
            document.getElementById("composeBody").placeholder = "Write your answer…";
            document.getElementById("composeBody").focus();
            render({ classroom, isMember, members, questions, milestones });
          });
        });
      }

      document.getElementById("milestoneList").innerHTML = milestones.length
        ? milestones.map(m => `<div style="padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;">
            <strong>⭐ ${m.score}</strong> ${escapeHtml(m.body.slice(0, 80))}
            <div class="q-meta">${escapeHtml(m.username)}</div></div>`).join("")
        : `<p class="empty-note" style="padding:0.5rem 0;">None yet</p>`;

      const ranked = [...questions].sort((a, b) => b.score - a.score);
      document.getElementById("rankedList").innerHTML = ranked.slice(0, 5).map(q =>
        `<div class="q-meta" style="justify-content:space-between;padding:0.25rem 0;"><span>${escapeHtml(q.title.slice(0, 40))}</span><strong>${q.score}</strong></div>`
      ).join("") || `<p class="empty-note" style="padding:0.5rem 0;">None</p>`;

      document.getElementById("memberCount").textContent = members.length;
      document.getElementById("memberList").innerHTML = members.map(m =>
        `<div class="member-chip" style="display:flex;align-items:center;gap:0.4rem;padding:0.3rem 0;">
          <img class="avatar-sm" src="${m.avatar_thumb || m.avatar_url || "/img/default-avatar.svg"}" style="width:22px;height:22px;" alt="" />
          <a href="/profile.html?id=${m.id}">${escapeHtml(m.username)}</a></div>`
      ).join("");
    }

    document.getElementById("sideToggle").addEventListener("click", () => {
      document.getElementById("sidePanel").classList.toggle("open");
    });
    document.getElementById("replyClear").addEventListener("click", () => {
      answeringId = null;
      document.getElementById("replyChip").classList.remove("show");
      document.getElementById("composeBody").placeholder = "Ask a question…";
      load();
    });

    function bindComposeFile(id) {
      document.getElementById(id).addEventListener("change", e => {
        composeFile = e.target.files[0] || null;
        document.getElementById("composeFileLabel").textContent = composeFile ? composeFile.name : "";
      });
    }
    bindComposeFile("composeImage");
    bindComposeFile("composeAudio");

    document.getElementById("composeSend").addEventListener("click", async () => {
      const body = document.getElementById("composeBody").value.trim();
      document.getElementById("composeError").textContent = "";
      if (!body && !composeFile) {
        document.getElementById("composeError").textContent = "Write something first.";
        return;
      }
      try {
        if (answeringId) {
          const fd = new FormData();
          fd.append("body", body || "(media)");
          if (composeFile) fd.append("media", composeFile);
          const res = await fetch(`/api/questions/${answeringId}/answers`, { method: "POST", body: fd, credentials: "same-origin" });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed");
          answeringId = null;
          document.getElementById("replyChip").classList.remove("show");
          document.getElementById("composeBody").placeholder = "Ask a question…";
        } else {
          const fd = new FormData();
          fd.append("title", body);
          fd.append("classroomId", String(classroomId));
          if (composeFile) fd.append("media", composeFile);
          const res = await fetch("/api/questions", { method: "POST", body: fd, credentials: "same-origin" });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed");
        }
        document.getElementById("composeBody").value = "";
        composeFile = null;
        document.getElementById("composeFileLabel").textContent = "";
        load();
      } catch (err) {
        document.getElementById("composeError").textContent = err.message;
      }
    });

    document.getElementById("joinBtn").addEventListener("click", async () => {
      await api(`/api/classrooms/${classroomId}/join`, { method: "POST" });
      if (socket) socket.emit("join_classroom", Number(classroomId));
      load();
    });

    document.getElementById("endBtn").addEventListener("click", () => document.getElementById("endDialog").showModal());
    document.getElementById("endCancel").addEventListener("click", () => document.getElementById("endDialog").close());
    document.getElementById("endForm").addEventListener("submit", async e => {
      e.preventDefault();
      await api(`/api/classrooms/${classroomId}/end`, {
        method: "POST",
        body: JSON.stringify({ conclusion: document.getElementById("conclusionInput").value.trim() }),
      });
      document.getElementById("endDialog").close();
      load();
    });

    (async function init() {
      me = await requireSession();
      renderNav("/classrooms.html");
      renderBottomNav("classes");
      ensureLightbox();
      socket = io();
      socket.on("connect", () => socket.emit("join_classroom", Number(classroomId)));
      socket.on("classroom_question", load);
      socket.on("classroom_answer", load);
      socket.on("classroom_vote", load);
      socket.on("classroom_member_joined", load);
      socket.on("classroom_ended", load);
      load();
    })();
  </script>
</body>
</html>
